# =============================================================================
# Configuration Nginx SPA — ART FASHION Monorepo
# Architecture : 1 domaine, 2 apps, 1 API upload
#   /           → Storefront vitrine client
#   /admin/     → Back-office CMS Admin
#   /api/       → Upload Server (proxy Node.js)
#   /uploads/   → Images produits (volume Docker persistant)
# =============================================================================

server {
    listen 80;
    server_name _;

    # Compression gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # Sécurité headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Proxy API vers Upload Server ─────────────────────────────────────────
    location /api/ {
        proxy_pass         http://upload-api:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        client_max_body_size 20M;
    }

    # ── Images produits (volume persistant) ──────────────────────────────────
    # ^~ nécessaire : sans lui, le bloc regex d'extensions plus bas intercepte
    # toute requête *.webp/*.jpg avant cet alias, et 404 (root ≠ alias).
    location ^~ /uploads/ {
        alias  /usr/share/nginx/html/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # ── Admin CMS : /admin/ → SPA React ──────────────────────────────────────
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # Cache agressif assets admin (JS/CSS avec hash Vite)
    # Note : "alias" et "root" ne peuvent pas coexister dans le même bloc
    # (nginx refuse de démarrer : "root" directive is duplicate). root+rewrite suffit ici.
    location ~ ^/admin/assets/ {
        rewrite ^/admin/assets/(.*) /assets/$1 break;
        root /usr/share/nginx/html/admin;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Storefront : / → SPA React ────────────────────────────────────────────
    location / {
        root  /usr/share/nginx/html/storefront;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Pas de cache sur index.html (SPA entry point)
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # Cache agressif assets storefront (JS/CSS/images avec hash Vite)
    # Négation (?!/admin/) : sans elle, ce bloc regex intercepterait aussi les
    # fichiers statiques admin hors /admin/assets/ (ex: /admin/favicon.svg) avec
    # le mauvais root (storefront), causant un 404.
    location ~* ^(?!/admin/).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        root    /usr/share/nginx/html/storefront;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SEO files ─────────────────────────────────────────────────────────────
    location = /robots.txt {
        root /usr/share/nginx/html/storefront;
        add_header Content-Type text/plain;
    }

    location = /sitemap.xml {
        root /usr/share/nginx/html/storefront;
        add_header Content-Type application/xml;
    }

    location = /site.webmanifest {
        root /usr/share/nginx/html/storefront;
        add_header Content-Type application/manifest+json;
    }

    # ── Pages d'erreur ────────────────────────────────────────────────────────
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html/storefront;
    }
}
